name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/lull.exe dist/Lull.exe
          Compress-Archive -Path dist/Lull.exe -DestinationPath Lull-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Lull-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Bundle universal Lull.app
        run: |
          APP=Lull.app/Contents
          mkdir -p $APP/MacOS $APP/Resources
          cp assets/lull.icns $APP/Resources/lull.icns
          lipo -create -output $APP/MacOS/lull \
            target/aarch64-apple-darwin/release/lull \
            target/x86_64-apple-darwin/release/lull
          sed "s/__VERSION__/${GITHUB_REF_NAME#v}/" packaging/macos/Info.plist > $APP/Info.plist
          codesign --force --deep --sign - Lull.app
          ditto -c -k --keepParent Lull.app Lull-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Lull-macos-universal.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Lull-windows-x64.zip Lull-macos-universal.zip \
            --repo "$GITHUB_REPOSITORY" --title "Lull $GITHUB_REF_NAME" --generate-notes
