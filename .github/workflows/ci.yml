name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: packaging/windows/build-installer.ps1 -Version 0.0.0
      - name: Install, check Start menu entry, uninstall
        shell: pwsh
        run: packaging/windows/test-installer.ps1
