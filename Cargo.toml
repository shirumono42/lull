[package]
name = "lull"
version = "0.1.0"
description = "Tiny tray app for white/pink/brown noise and binaural beats"
license = "MIT"
repository = "https://github.com/shirumono42/lull"
edition = "2024"

[dependencies]
cpal = "0.18"
epaint_default_fonts = "0.37"
fontdue = "0.9"
global-hotkey = "0.9"
softbuffer = "0.4"
tiny-skia = "0.12"
tray-icon = "0.26"
winit = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
