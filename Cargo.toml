[package]
name = "lull"
version = "0.2.1"
description = "Tiny tray app for white/pink/brown noise and binaural beats"
license = "MIT"
repository = "https://github.com/shirumono42/lull"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
cpal = "0.18"
epaint_default_fonts = "0.37"
global-hotkey = "0.9"
softbuffer = "0.4"
tiny-skia = "0.12"
tray-icon = "0.26"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
